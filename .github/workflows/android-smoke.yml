name: Android 14 install check

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: 'Successful Android APK workflow run ID'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  android14:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Download signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
          GH_REPO: ${{ github.repository }}
        run: gh run download "$BUILD_RUN" --pattern 'jarvis-android-*' --dir apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android14-install-check
          path: smoke-results/
