name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master, 'codex/**']
    tags: ['android-v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_VOICE_LANG: fr-FR
      VITE_BOOT_SEQUENCE: 'false'
      # Kokoro pulls in onnxruntime-node; the APK never uses its CUDA binaries,
      # whose download now fails on the runner.
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx cap sync android
      - name: Restore persistent signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo '::error::Configure the four ANDROID_* signing secrets described in docs/android.md.'
            exit 1
          fi
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/jarvis.jks"
      - name: Build signed APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          JARVIS_KEYSTORE: ${{ runner.temp }}/jarvis.jks
          JARVIS_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: bash gradlew --no-daemon assembleRelease
      - name: Compile pull request
        if: github.event_name == 'pull_request'
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: jarvis-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/jarvis.jks"

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jarvis-android-${{ github.run_number }}
          path: apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" apk/app-release.apk --title "JARVIS $TAG" --generate-notes
